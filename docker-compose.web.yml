version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: invest-postgres
    environment:
      POSTGRES_DB: invest_trading
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - invest-network
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: invest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - invest-network
    restart: unless-stopped

  # Backend API Server
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: invest-server
    environment:
      NODE_ENV: production
      PORT: 3001
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: invest_trading
      DB_USER: postgres
      DB_PASSWORD: password
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-here
    ports:
      - "3001:3001"
    depends_on:
      - postgres
      - redis
    networks:
      - invest-network
    restart: unless-stopped

  # Frontend Web Application
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: invest-client
    environment:
      REACT_APP_API_URL: http://localhost:3001/api
    ports:
      - "3000:80"
    depends_on:
      - server
    networks:
      - invest-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  invest-network:
    driver: bridge